<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛顿环光学仿真系统</title>
<style>
:root {
    --bg-main: #060a12;
    --bg-panel: #0c1220;
    --bg-card: #10182b;
    --bg-input: #0a0f1c;
    --tech-cyan: #00e5ff;
    --tech-cyan-light: #7ef0ff;
    --tech-blue: #0088ff;
    --tech-blue-light: #63b8ff;
    --tech-red: #ff3a4c;
    --text-main: #f8fbff;
    --text-sub: #c4d4f0;
    --text-faint: #8096b8;
    --border-normal: #1c2a48;
    --border-glow: rgba(0, 229, 255, 0.35);
    --glow-soft: 0 0 18px rgba(0, 229, 255, 0.15);
    --radius-md: 12px;
    --radius-lg: 20px;
    --trans-fast: 0.18s ease;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html, body {
    width: 100%;
    height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg-main);
    color: var(--text-sub);
    overflow: hidden;
}
.page-wrap {
    width: 100%;
    height: 100%;
    padding: 24px;
    border: 1px solid var(--border-glow);
    box-shadow: var(--glow-soft);
    border-radius: var(--radius-lg);
}
.main-title {
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 20px;
    background: linear-gradient(90deg, var(--tech-blue-light), var(--tech-cyan-light));
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: 1px;
}
.wrap {
    width: 100%;
    height: calc(100% - 52px);
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
}
.canvas-box {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-glow);
    box-shadow: var(--glow-soft);
    padding: 20px;
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--tech-cyan) var(--bg-input);
}
.canvas-box::-webkit-scrollbar {
    width: 5px;
}
.canvas-box::-webkit-scrollbar-track {
    background: var(--bg-input);
    border-radius: 3px;
}
.canvas-box::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--tech-cyan), var(--tech-blue));
    border-radius: 3px;
}
.canvas-card {
    width: 400px;
    height: 400px;
    background: var(--bg-card);
    border-radius: var(--radius-md);
    padding: 14px;
    position: relative;
    border: 1px solid var(--border-normal);
}
.canvas-card h4 {
    position: absolute;
    top: 10px;
    left: 12px;
    color: var(--text-main);
    font-size: 14px;
    font-weight: 500;
    z-index: 2;
    background: rgba(8,12,22,0.8);
    padding: 4px 10px;
    border-radius: 6px;
    backdrop-filter: blur(4px);
}
canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 6px;
}
#patternCanvas {
    border-radius: 50%;
    box-shadow: 0 0 30px #000, inset 0 0 0 1px var(--border-glow);
}
.control {
    background: var(--bg-panel);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-glow);
    box-shadow: var(--glow-soft);
    padding: 22px;
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--tech-cyan) var(--bg-input);
}
.control::-webkit-scrollbar {
    width: 5px;
}
.control::-webkit-scrollbar-track {
    background: var(--bg-input);
    border-radius: 3px;
}
.control::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--tech-cyan), var(--tech-blue));
    border-radius: 3px;
}
.control h2 {
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-normal);
    color: var(--text-main);
    font-size: 20px;
    font-weight: 600;
}
.desc-single {
    font-size: 14px;
    color: var(--text-faint);
    line-height: 1.6;
    margin-bottom: 16px;
}
.formula {
    background: linear-gradient(135deg, var(--bg-input), #0e1628);
    padding: 14px;
    border-left: 3px solid var(--tech-cyan);
    border-radius: 8px;
    text-align: center;
    font-size: 20px;
    margin: 14px 0 18px;
    color: var(--text-main);
}
.group {
    background: linear-gradient(135deg, var(--bg-card), #121c33);
    padding: 14px;
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    border: 1px solid var(--border-normal);
}
.group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-main);
    font-size: 15px;
}
.slider-wrap {
    width: 100%;
    margin: 6px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.slider-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
}
.slider-bar-row input[type=range] {
    flex: 1;
    height: 6px;
    accent-color: var(--tech-cyan);
    background: var(--bg-input);
    border-radius: 3px;
    outline: none;
}
.input-unit-group {
    display: flex;
    gap: 4px;
    align-items: center;
}
input[type=number] {
    width: 70px;
    background: var(--bg-input);
    border: 1px solid var(--border-normal);
    color: var(--text-main);
    padding: 6px;
    text-align: right;
    border-radius: 6px;
    font-size: 14px;
}
input[type=number]:focus {
    outline: none;
    box-shadow: 0 0 8px rgba(0,229,255,0.35);
    border-color: var(--tech-cyan);
}
input:disabled {
    opacity: 0.3;
}
.btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}
button {
    border: none;
    padding: 10px 0;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-faint);
    background: linear-gradient(135deg, var(--bg-input), #0d1424);
    flex: 1;
    border: 1px solid var(--border-normal);
    transition: all 0.18s ease;
    font-weight: 500;
}
button:hover {
    border-color: var(--tech-cyan);
    color: var(--text-main);
    box-shadow: 0 0 12px rgba(0,229,255,0.18);
}
button.active {
    background: linear-gradient(135deg, #0058bb, #00d8ff);
    color: #000;
    font-weight: 600;
}
.reset-btn {
    background: linear-gradient(135deg, #88182b, #ff3a4c);
    color: #fff;
    border-color: var(--tech-red);
}
.air-desc {
    margin-top: 10px;
    padding: 10px;
    border: 1px dashed var(--tech-cyan-light);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-faint);
    display: none;
}
.air-desc strong {
    color: var(--tech-cyan-light);
}
.air-line {
    display: block;
    margin: 2px 0;
}
.auto-check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
}
.auto-check-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--tech-cyan);
}
.speed-slider-wrap {
    margin: 14px 0 10px;
}
.speed-label-row {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-faint);
}
.auto-btn-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}
.auto-reset-btn {
    flex: 1;
    background: linear-gradient(135deg, #222838, #151c2e);
    color: var(--text-main);
}
.auto-run-btn {
    flex: 1.2;
    background: linear-gradient(135deg, #0066dd, #00b8ff);
    color: #000;
    font-weight: 600;
}
.auto-run-btn.pause {
    background: linear-gradient(135deg, #dd6600, #ffb800);
}
.data-card {
    flex: 1;
    min-width: 0;
    background: var(--bg-input);
    border-radius: var(--radius-md);
    padding: 16px 8px;
    text-align: center;
    border: 1px solid var(--border-normal);
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.data-label {
    font-size: 16px;
    color: var(--text-faint);
    margin-bottom: 10px;
    white-space: nowrap;
}
.data-value {
    font-size: clamp(20px, 5vw, 42px);
    color: var(--text-main);
    font-weight: 600;
    word-break: break-all;
    line-height: 1.2;
}
.modal-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.78);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
}
.modal-box {
    width: 700px;
    max-height: 82vh;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: var(--radius-lg);
    box-shadow: var(--glow-soft);
    padding: 24px;
    overflow-y: auto;
}
.modal-title {
    font-size: 22px;
    color: var(--text-main);
    text-align: center;
    padding-bottom: 10px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border-normal);
    font-weight: 600;
}
.modal-table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
}
.modal-table th, .modal-table td {
    border: 1px solid var(--border-normal);
    padding: 12px;
    font-size: 14px;
    color: var(--text-sub);
    vertical-align: middle;
}
.modal-table th {
    background-color: var(--bg-card);
    color: var(--text-main);
}
.modal-close-btn {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    background: linear-gradient(135deg, #182336, #0f1729);
    border: 1px solid var(--border-normal);
    color: var(--text-main);
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}
.modal-close-btn:hover {
    border-color: var(--tech-cyan);
    box-shadow: 0 0 10px rgba(0,229,255,0.15);
}
</style>
</head>
<body>
<div class="page-wrap">
    <h1 class="main-title">牛顿环光学仿真系统</h1>
    <div class="wrap">
        <div class="canvas-box">
            <div class="canvas-card">
                <h4>干涉环视图</h4>
                <canvas id="patternCanvas" width="400" height="400"></canvas>
            </div>
            <div class="canvas-card" id="setupWrap" style="display:none;">
                <h4>实验装置总图</h4>
                <canvas id="setupCanvas" width="400" height="400"></canvas>
            </div>
            <div class="canvas-card" id="airWrap" style="display:none;">
                <h4>介质膜斜透视剖面</h4>
                <canvas id="airFilmCanvas" width="400" height="400"></canvas>
            </div>
        </div>

        <div class="control">
            <h2>参数控制面板</h2>
            <div class="desc-single">
                牛顿环是平凸透镜与平板玻璃间空气薄膜产生的等厚干涉现象，可用于测量透镜曲率半径。
            </div>
            <div class="formula">r<sub>k</sub> = √(k·R·λ)</div>

            <div class="group">
                <div class="group-header">实验查阅</div>
                <div class="btn-row">
                    <button onclick="openModal('principle')">实验原理</button>
                    <button onclick="openModal('rule')">实验规律</button>
                </div>
            </div>

            <div class="group">
                <div class="group-header">光源类型</div>
                <div class="btn-row">
                    <button class="active" id="btnMono" onclick="setLight('mono')">单色光</button>
                    <button id="btnWhite" onclick="setLight('white')">白光</button>
                </div>
            </div>

            <div class="group">
                <div class="group-header">实时仿真数据</div>
                <div class="data-row">
                    <div class="data-card">
                        <div class="data-label">条纹间距 ΔX</div>
                        <div class="data-value" id="dxVal">0.00 μm</div>
                    </div>
                    <div class="data-card">
                        <div class="data-label">最大厚度 D<sub>MAX</sub></div>
                        <div class="data-value" id="dMaxVal">0.00 μm</div>
                    </div>
                    <div class="data-card">
                        <div class="data-label">暗/明纹总数</div>
                        <div class="data-value" id="totalRingVal">0</div>
                    </div>
                </div>
            </div>

            <div class="group">
                <div class="group-header">入射波长 λ (nm)</div>
                <div class="slider-wrap">
                    <div class="slider-bar-row">
                        <input id="sliderLam" min="380" max="780" value="589" step="1" type="range">
                        <div class="input-unit-group">
                            <input id="numLam" value="589" min="380" max="780" step="1" type="number">
                            <span>nm</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="group">
                <div class="group-header">透镜曲率半径 R (m)</div>
                <div class="slider-wrap">
                    <div class="slider-bar-row">
                        <input id="sliderR" min="0.5" max="20" value="2.0" step="0.1" type="range">
                        <div class="input-unit-group">
                            <input id="numR" value="2.0" min="0.5" max="20" step="0.1" type="number">
                            <span>m</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="group">
                <div class="group-header">视图切换</div>
                <div class="btn-row">
                    <button id="btnSetup" onclick="toggleCanvas('setup')">装置总图</button>
                    <button id="btnAir" onclick="toggleCanvas('air')">介质膜剖面</button>
                </div>
                <div class="air-desc" id="airDescBox">
                    <span class="air-line"><strong>光路①</strong>：平凸透镜下表面反射光</span>
                    <span class="air-line"><strong>光路②</strong>：空气膜上表面反射光</span>
                    <span class="air-line">干涉条件：两束反射光频率相同、振动方向一致、光程差恒定。</span>
                </div>
            </div>

            <div class="group">
                <div class="group-header">自动变化控制（勾选后启动）</div>
                <div class="auto-check-row">
                    <input type="checkbox" id="autoLamCheck">
                    <label>波长自动变化</label>
                </div>
                <div class="auto-check-row">
                    <input type="checkbox" id="autoRCheck">
                    <label>曲率半径自动变化</label>
                </div>

                <div class="speed-slider-wrap">
                    <div class="group-header">动画速度（仅3档，拖动松手锁定）</div>
                    <input id="speedSlider" min="0" max="2" value="1" step="1" type="range" style="width:100%;margin:8px 0;">
                    <div class="speed-label-row">
                        <span>慢速</span>
                        <span>中速</span>
                        <span>快速</span>
                    </div>
                </div>

                <div class="auto-btn-row">
                    <button class="auto-reset-btn" onclick="resetAll()">重置全部参数</button>
                    <button class="auto-run-btn" id="autoRunBtn" onclick="toggleAutoRun()">▶ 开始自动变化</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-mask" id="modalMask">
    <div class="modal-box">
        <h3 class="modal-title" id="modalTitle"></h3>
        <div id="modalContent"></div>
        <button class="modal-close-btn" onclick="closeModal()">关闭窗口</button>
    </div>
</div>

<script>
const state = {
    lambda: 589,
    R: 2.0,
    lightMode: "mono"
}
const viewShow = {
    setup: false,
    air: false
}
const MARK_RED = "#ff3a4c";
const airDescBox = document.getElementById("airDescBox");

const dxValDom = document.getElementById("dxVal");
const dMaxValDom = document.getElementById("dMaxVal");
const totalRingValDom = document.getElementById("totalRingVal");

let autoRunning = false;
let autoTimer = null;
let speedStep = [1, 4, 10];
let lamDir = 1, RDir = 1;

let lock = false;
function refreshAll(){
    if(lock) return;
    lock = true;
    requestAnimationFrame(()=>{
        drawPattern();
        if(viewShow.setup) drawSetup();
        if(viewShow.air) drawAirFilm();
        updateRealTimeData();
        lock = false;
    })
}

function updateRealTimeData(){
    const λ = state.lambda * 1e-9;
    const R = state.R;
    // 默认空气介质 n=1
    const n = 1.0; 

    const scale = 0.0085;
    const r_max_phys = scale;

    const dMax = (r_max_phys * r_max_phys) / (2 * R);
    const dMaxUm = dMax * 1e6;
    dMaxValDom.innerText = dMaxUm.toFixed(3) + " μm";

    const k1 = 20;
    const k2 = 21;
    const r1 = Math.sqrt(k1 * R * λ / n);
    const r2 = Math.sqrt(k2 * R * λ / n);
    const dx = (r2 - r1) * 1e6;
    dxValDom.innerText = dx.toFixed(3) + " μm";

    const totalK = Math.floor((2 * n * dMax) / λ);
    totalRingValDom.innerText = totalK;
}

function resetAll(){
    stopAutoAnim();
    state.lambda = 589;
    state.R = 2.0;
    state.lightMode = "mono";
    document.getElementById("sliderLam").value = 589;
    document.getElementById("numLam").value = 589;
    document.getElementById("sliderR").value = 2.0;
    document.getElementById("numR").value = 2.0;
    document.getElementById("btnMono").classList.add("active");
    document.getElementById("btnWhite").classList.remove("active");
    document.getElementById("sliderLam").disabled = false;
    document.getElementById("numLam").disabled = false;
    document.getElementById("autoLamCheck").checked = false;
    document.getElementById("autoRCheck").checked = false;
    document.getElementById("speedSlider").value = 1;
    refreshAll();
}

function toggleCanvas(type){
    let wrapId,btnId;
    if(type === "setup"){
        wrapId = "setupWrap";
        btnId = "btnSetup";
        viewShow.setup = !viewShow.setup;
    }else{
        wrapId = "airWrap";
        btnId = "btnAir";
        viewShow.air = !viewShow.air;
    }
    const wrap = document.getElementById(wrapId);
    const btn = document.getElementById(btnId);
    if(viewShow[type]){
        wrap.style.display = "block";
        btn.classList.add("active");
    }else{
        wrap.style.display = "none";
        btn.classList.remove("active");
    }
    airDescBox.style.display = viewShow.air ? "block" : "none";
    refreshAll();
}

function bindCtrl(key,sliderId,numId,min,max){
    const s = document.getElementById(sliderId);
    const n = document.getElementById(numId);
    function syncValue(val){
        const numVal = Number(val);
        const safeVal = Math.max(min, Math.min(max, numVal));
        s.value = safeVal;
        n.value = safeVal;
        state[key] = safeVal;
        refreshAll();
    }
    s.addEventListener('input', ()=> syncValue(s.value));
    n.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
            e.preventDefault();
            syncValue(n.value);
            n.blur();
        }
    });
    n.addEventListener('blur', ()=> syncValue(n.value));
}
bindCtrl("lambda","sliderLam","numLam",380,780);
bindCtrl("R","sliderR","numR",0.5,20);

function setLight(mode){
    state.lightMode = mode;
    const mono = mode === "mono";
    document.getElementById("btnMono").classList.toggle("active",mono);
    document.getElementById("btnWhite").classList.toggle("active",!mono);
    document.getElementById("sliderLam").disabled = !mono;
    document.getElementById("numLam").disabled = !mono;
    refreshAll();
}

function waveToRgb(wl){
    let r = 0, g = 0, b = 0;
    if (wl >= 380 && wl < 440) {
        r = -(wl - 440) / 60; g = 0; b = 1;
    } else if (wl >= 440 && wl < 490) {
        r = 0; g = (wl - 440) / 50; b = 1;
    } else if (wl >= 490 && wl < 510) {
        r = 0; g = 1; b = -(wl - 510) / 20;
    } else if (wl >= 510 && wl < 580) {
        r = (wl - 510) / 70; g = 1; b = 0;
    } else if (wl >= 580 && wl < 645) {
        r = 1; g = -(wl - 645) / 65; b = 0;
    } else if (wl >= 645 && wl <= 780) {
        r = 1; g = 0; b = 0;
    }
    let fade = 1.0;
    if (wl < 420) fade = 0.3 + 0.7 * (wl - 380) / 40;
    if (wl > 700) fade = 0.3 + 0.7 * (780 - wl) / 80;
    r *= fade; g *= fade; b *= fade;
    return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
}

function getLightColor(){
    if(state.lightMode==="white") return "rgba(255,255,255,0.92)";
    const [r,g,b] = waveToRgb(state.lambda);
    return `rgb(${r},${g},${b})`;
}

function drawArrow(ctx,x1,y1,x2,y2,color){
    const head=8;
    const ang=Math.atan2(y2-y1,x2-x1);
    ctx.strokeStyle=color;ctx.lineWidth=2.5;
    ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-head*Math.cos(ang-Math.PI/6),y2-head*Math.sin(ang-Math.PI/6));
    ctx.lineTo(x2-head*Math.cos(ang+Math.PI/6),y2-head*Math.sin(ang+Math.PI/6));
    ctx.closePath();ctx.fill();
}

function drawReverseArrow(ctx, lineX, tipY, baseY, color){
    const head = 4;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(lineX, tipY);
    ctx.lineTo(lineX - head, tipY + head);
    ctx.lineTo(lineX + head, tipY + head);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(lineX, baseY);
    ctx.lineTo(lineX - head, baseY - head);
    ctx.lineTo(lineX + head, baseY - head);
    ctx.closePath();
    ctx.fill();
}

function drawText(ctx,text,x,y,opts={}){
    ctx.font=opts.font||"14px system-ui, sans-serif";
    ctx.fillStyle=opts.color||"#f8fbff";
    ctx.textAlign=opts.align||"center";
    ctx.textBaseline="middle";
    if(opts.bold) ctx.font = "bold " + ctx.font;
    ctx.fillText(text,x,y);
}

function getLensGeometry(centerX, plateY, scale, maxHalfWidth){
    const Rpx = state.R * scale;
    const arcCenterY = plateY - Rpx;
    const maxAngle = Math.asin(Math.min(maxHalfWidth / Rpx, 1));
    const leftX = centerX - Rpx * Math.sin(maxAngle);
    const rightX = centerX + Rpx * Math.sin(maxAngle);
    const lensBottomY = plateY;
    const lensTopY = arcCenterY + Rpx * Math.cos(maxAngle);
    const lensBottomX = centerX;
    return {
        Rpx, arcCenterY, maxAngle, leftX, rightX, lensTopY, lensBottomY, lensBottomX
    };
}

const patCanvas = document.getElementById("patternCanvas");
const patCtx = patCanvas.getContext("2d");

function drawPattern(){
    const w=patCanvas.width,h=patCanvas.height;
    const cx=w/2,cy=h/2;
    const img=patCtx.createImageData(w,h);
    const data=img.data;
    const scale=0.0085/w;
    const R=state.R;
    const nMed = 1.0; // 固定为空气
    const lamM = state.lambda*1e-9;

    for(let y=0;y<h;y++){
        const dy=y-cy;
        const dy2=dy*dy;
        for(let x=0;x<w;x++){
            const dx=x-cx;
            const r2=dx*dx+dy*dy;
            const rPhys2 = r2*scale*scale;
            const d = rPhys2/(2*R);
            
            let rCh=0,gCh=0,bCh=0;

            if(state.lightMode==="white"){
                const lams_white = [650, 532, 450]; // 单位 nm
                const weights = [1.0, 1.0, 0.8];
                
                for(let i = 0; i < 3; i++){
                    const l_m = lams_white[i] * 1e-9;
                    
                    const delta_refl = 2 * nMed * d + lamM / 2; 
                    
                    const phase = 2 * Math.PI * delta_refl / l_m;
                    
                    const cosHalf = Math.cos(phase / 2);
                    const I = cosHalf * cosHalf;
                    
                    const w_val = weights[i];
                    if(i === 0) rCh += I * w_val;
                    else if(i === 1) gCh += I * w_val;
                    else bCh += I * w_val;
                }
                
                rCh = Math.max(0, Math.min(1, rCh));
                gCh = Math.max(0, Math.min(1, gCh));
                bCh = Math.max(0, Math.min(1, bCh));
            }else{
                const opticalPath = 2 * nMed * d + lamM / 2;
                const phase = Math.PI*2*opticalPath/lamM;
                const I = Math.sin(phase)**2;
                const [r,g,b] = waveToRgb(state.lambda);
                rCh = I*r/255;
                gCh = I*g/255;
                bCh = I*b/255;
            }

            const idx=(y*w+x)*4;
            data[idx] = Math.round(rCh*255);
            data[idx+1] = Math.round(gCh*255);
            data[idx+2] = Math.round(bCh*255);
            data[idx+3] = 255;
        }
    }
    patCtx.putImageData(img,0,0);
}

const setupCanvas = document.getElementById("setupCanvas");
const setupCtx = setupCanvas.getContext("2d");

function drawSetup(){
    const W=setupCanvas.width,H=setupCanvas.height;
    setupCtx.clearRect(0,0,W,H);
    const lightCol = getLightColor();

    const Sx = W*0.10, Sy = H*0.48;
    const Lx = W*0.24, Ly = H*0.48;
    const Mx = W*0.48, My = H*0.48;
    const Tx = W*0.48, Ty = H*0.12;
    const PlateX = W*0.48, PlateY = H*0.80;
    const fixedPlateW = 180;
    const fixedPlateH = 14;

    const gradS = setupCtx.createRadialGradient(Sx,Sy,0,Sx,Sy,16);
    gradS.addColorStop(0,"#ffffff");
    gradS.addColorStop(1,"#b0e8ff");
    setupCtx.fillStyle=gradS;
    setupCtx.beginPath();
    setupCtx.moveTo(Sx-12, Sy-8);
    setupCtx.lineTo(Sx+12, Sy);
    setupCtx.lineTo(Sx-12, Sy+8);
    setupCtx.closePath();
    setupCtx.fill();
    drawText(setupCtx,"S",Sx-22,Sy,{font:"bold 18px",align:"right",bold:true});

    setupCtx.strokeStyle="#e8f4ff";setupCtx.lineWidth=2.5;
    setupCtx.beginPath();
    setupCtx.ellipse(Lx, Ly, 8, 32, 0, 0, Math.PI*2);
    setupCtx.stroke();
    const gradL = setupCtx.createRadialGradient(Lx,Ly,0,Lx,Ly,32);
    gradL.addColorStop(0,"rgba(150,210,255,0.35)");
    gradL.addColorStop(1,"rgba(80,160,240,0.12)");
    setupCtx.fillStyle=gradL;
    setupCtx.fill();
    drawText(setupCtx,"L",Lx, Ly-40,{font:"bold 18px",bold:true});

    drawArrow(setupCtx, Sx+10, Sy-6, Lx-10, Ly-16, lightCol);
    drawArrow(setupCtx, Sx+10, Sy+6, Lx-10, Ly+16, lightCol);

    const mTopHitX = Mx - 16;
    const mTopHitY = My - 16;
    const mBotHitX = Mx + 16;
    const mBotHitY = My + 16;
    drawArrow(setupCtx, Lx+10, Ly-16, mTopHitX, mTopHitY, lightCol);
    drawArrow(setupCtx, Lx+10, Ly+16, mBotHitX, mBotHitY, lightCol);

    setupCtx.save();
    setupCtx.translate(Mx, My);
    setupCtx.rotate(-Math.PI / 4);
    const gradM = setupCtx.createLinearGradient(-4,0,4,0);
    gradM.addColorStop(0,"rgba(80,180,255,0.15)");
    gradM.addColorStop(0.5,"rgba(160,230,255,0.32)");
    gradM.addColorStop(1,"rgba(80,180,255,0.15)");
    setupCtx.fillStyle=gradM;
    setupCtx.strokeStyle="rgba(180,235,255,0.9)";
    setupCtx.lineWidth=2.5;
    setupCtx.fillRect(-4, -42, 8, 84);
    setupCtx.strokeRect(-4, -42, 8, 84);
    setupCtx.restore();
    drawText(setupCtx,"M 半透\n半反镜",Mx+40, My+10,{font:"bold 16px",align:"left",bold:true});

    const geoScale = H*0.32;
    const geoMaxHalf = W*0.16;
    const geo = getLensGeometry(PlateX, PlateY, geoScale, geoMaxHalf);
    const {Rpx, arcCenterY, maxAngle, leftX, rightX, lensTopY, lensBottomY, lensBottomX} = geo;

    setupCtx.beginPath();
    setupCtx.moveTo(leftX, lensTopY);
    setupCtx.lineTo(rightX, lensTopY);
    setupCtx.arc(PlateX, arcCenterY, Rpx, Math.PI/2-maxAngle, Math.PI/2+maxAngle);
    setupCtx.closePath();
    const gradLens = setupCtx.createLinearGradient(PlateX, lensTopY, PlateX, PlateY);
    gradLens.addColorStop(0,"rgba(160,220,255,0.22)");
    gradLens.addColorStop(1,"rgba(90,170,240,0.08)");
    setupCtx.fillStyle=gradLens;
    setupCtx.fill();
    setupCtx.strokeStyle="#90d4ff";setupCtx.lineWidth=2.5;setupCtx.stroke();

    const gradPlate = setupCtx.createLinearGradient(0,PlateY,0,PlateY+fixedPlateH);
    gradPlate.addColorStop(0,"rgba(120,200,140,0.4)");
    gradPlate.addColorStop(1,"rgba(60,130,80,0.2)");
    setupCtx.fillStyle=gradPlate;
    setupCtx.strokeStyle="#d0e8d8";setupCtx.lineWidth=1.8;
    setupCtx.fillRect(PlateX-fixedPlateW/2, PlateY, fixedPlateW, fixedPlateH);
    setupCtx.strokeRect(PlateX-fixedPlateW/2, PlateY, fixedPlateW, fixedPlateH);

    drawArrow(setupCtx, mTopHitX, mTopHitY, mTopHitX, lensTopY, lightCol);
    drawArrow(setupCtx, mBotHitX, mBotHitY, mBotHitX, lensTopY, lightCol);

    setupCtx.setLineDash([4,3]);
    setupCtx.strokeStyle=MARK_RED;
    setupCtx.lineWidth=2;
    setupCtx.beginPath();
    setupCtx.moveTo(PlateX, arcCenterY);
    setupCtx.lineTo(PlateX, PlateY);
    setupCtx.stroke();
    setupCtx.setLineDash([]);
    drawText(setupCtx,"R", PlateX-28, (arcCenterY + PlateY)/2, {font:"bold italic 20px", color:MARK_RED,bold:true});

    const rm = 35;
    const MpointX = PlateX + rm;
    const dpx = (rm * rm) / (2 * Rpx);
    const MpointY = PlateY - dpx;

    setupCtx.setLineDash([4,3]);
    setupCtx.strokeStyle=MARK_RED;
    setupCtx.lineWidth=1.5;
    setupCtx.beginPath();
    setupCtx.moveTo(PlateX, MpointY);
    setupCtx.lineTo(MpointX, MpointY);
    setupCtx.stroke();
    setupCtx.setLineDash([]);
    drawArrow(setupCtx, PlateX, MpointY, MpointX, MpointY, MARK_RED);
    drawText(setupCtx,"rₘ", PlateX + rm/2, MpointY - 12, {font:"bold italic 16px", color:MARK_RED,bold:true});

    const dLineX = MpointX + 4;
    const dBottom = PlateY;
    const dTop = MpointY;
    if(dpx > 0.5){
        setupCtx.setLineDash([4,3]);
        setupCtx.strokeStyle=MARK_RED;
        setupCtx.lineWidth=2;
        setupCtx.beginPath();
        setupCtx.moveTo(dLineX, dTop);
        setupCtx.lineTo(dLineX, dBottom);
        setupCtx.stroke();
        setupCtx.setLineDash([]);
        drawReverseArrow(setupCtx, dLineX, dTop, dBottom, MARK_RED);
        drawText(setupCtx,"d", dLineX + 12, (dTop + dBottom) / 2, {font:"bold italic 18px", color:MARK_RED,align:"left",bold:true});
    }

    drawArrow(setupCtx, mTopHitX, lensTopY, mTopHitX, mTopHitY, lightCol);
    drawArrow(setupCtx, mBotHitX, lensTopY, mBotHitX, mBotHitY, lightCol);
    drawArrow(setupCtx, mTopHitX, mTopHitY, mTopHitX, Ty+20, lightCol);
    drawArrow(setupCtx, mBotHitX, mBotHitY, mBotHitX, Ty+20, lightCol);

    const micW = 36, micH = 44;
    const gradMic = setupCtx.createLinearGradient(Tx,Ty,Tx,Ty+micH);
    gradMic.addColorStop(0,"#70a8ff");
    gradMic.addColorStop(1,"#3060aa");
    setupCtx.fillStyle=gradMic;
    setupCtx.fillRect(Tx-micW/2, Ty, micW, micH);
    setupCtx.beginPath();
    setupCtx.arc(Tx, Ty+micH, micW/2-4, 0, Math.PI);
    setupCtx.fillStyle="#b8e0ff";
    setupCtx.fill();
    drawText(setupCtx,"显微镜T", Tx, Ty-18, {font:"bold 18px",bold:true});
}

const airCanvas = document.getElementById("airFilmCanvas");
const airCtx = airCanvas.getContext("2d");

function drawAirFilm(){
    const W=airCanvas.width,H=airCanvas.height;
    airCtx.clearRect(0,0,W,H);
    const lightCol = getLightColor();
    const cx=W/2;
    const plateY = H*0.75;
    const plateBot = H*0.88;
    const halfW = W*0.48;
    const baseDeflect = 8;
    const outBias = 9;
    const gap = 10;
    const rayOutOffset = 70;

    const gradPlate = airCtx.createLinearGradient(0,plateY,0,plateBot);
    gradPlate.addColorStop(0,"rgba(100,180,120,0.42)");
    gradPlate.addColorStop(1,"rgba(50,110,70,0.2)");
    airCtx.fillStyle=gradPlate;
    airCtx.strokeStyle="#c0e8cc";airCtx.lineWidth=1.8;
    airCtx.fillRect(cx-halfW,plateY,halfW*2,plateBot-plateY);
    airCtx.strokeRect(cx-halfW,plateY,halfW*2,plateBot-plateY);
    airCtx.strokeStyle="#777";
    airCtx.lineWidth=1;
    for(let x = cx-halfW; x < cx+halfW; x += 12){
        airCtx.beginPath();
        airCtx.moveTo(x, plateBot);
        airCtx.lineTo(x+16, plateY);
        airCtx.stroke();
    }
    drawText(airCtx,"O", cx, plateBot + 16, {font:"bold 16px", color:"#fff",bold:true});

    const geoScale = H*0.45;
    const geoMaxHalf = halfW;
    const geo = getLensGeometry(cx, plateY, geoScale, geoMaxHalf);
    const {Rpx, arcCenterY, maxAngle, leftX, rightX, lensTopY, lensBottomY, lensBottomX} = geo;

    airCtx.beginPath();
    airCtx.moveTo(leftX,lensTopY);
    airCtx.lineTo(rightX,lensTopY);
    airCtx.arc(cx,arcCenterY,Rpx,Math.PI/2-maxAngle,Math.PI/2+maxAngle);
    airCtx.closePath();
    const grad = airCtx.createLinearGradient(cx,lensTopY,cx,plateY);
    grad.addColorStop(0,"rgba(140,200,255,0.24)");
    grad.addColorStop(1,"rgba(70,150,230,0.09)");
    airCtx.fillStyle=grad;airCtx.fill();
    airCtx.strokeStyle="#90d4ff";airCtx.lineWidth=2.5;airCtx.stroke();

    const Mscale = maxAngle * 0.72;
    const Mx = cx + Rpx * Math.sin(Mscale);
    const My = arcCenterY + Rpx * Math.cos(Mscale);
    const MPrimeX = cx;
    const MPrimeY = My;
    drawText(airCtx,"M'", MPrimeX - 12, MPrimeY, {font:"bold 16px", color:"#fff",bold:true});
    drawText(airCtx,"M", Mx + 12, My - 10, {font:"bold 16px", color:"#fff",bold:true});

    const Pscale = maxAngle * 0.58;
    const Px = cx + Rpx * Math.sin(Pscale);
    const Py = arcCenterY + Rpx * Math.cos(Pscale);

    airCtx.setLineDash([4,3]);
    airCtx.strokeStyle=MARK_RED;
    airCtx.lineWidth=2;
    airCtx.beginPath();
    airCtx.moveTo(cx, arcCenterY);
    airCtx.lineTo(Mx, My);
    airCtx.stroke();
    airCtx.setLineDash([]);
    drawText(airCtx,"R", (cx + Mx)/2 - 30, (arcCenterY + My)/2 - 40, {font:"bold italic 22px", color:MARK_RED,bold:true});

    airCtx.setLineDash([4,3]);
    airCtx.strokeStyle=MARK_RED;
    airCtx.lineWidth=1.8;
    airCtx.beginPath();
    airCtx.moveTo(MPrimeX, MPrimeY);
    airCtx.lineTo(Mx, My);
    airCtx.stroke();
    airCtx.setLineDash([]);
    drawText(airCtx,"rₘ", (MPrimeX + Mx)/2, MPrimeY + 14, {font:"bold italic 20px", color:MARK_RED,bold:true});

    const OPrimeX = Mx - baseDeflect;
    const OPrimeY = plateY;
    drawText(airCtx,"O'", OPrimeX + 12, OPrimeY - 10, {font:"bold 16px", color:"#fff",bold:true});

    const rm = 35;
    const dpx = (rm * rm) / (2 * Rpx);
    const dTop = My;
    const dBottom = plateY;
    const dLineX = Mx + 6;
    if(dpx > 0.5){
        airCtx.setLineDash([4,3]);
        airCtx.strokeStyle=MARK_RED;
        airCtx.lineWidth=2;
        airCtx.beginPath();
        airCtx.moveTo(dLineX, dTop);
        airCtx.lineTo(dLineX, dBottom);
        airCtx.stroke();
        airCtx.setLineDash([]);
        drawReverseArrow(airCtx, dLineX, dTop, dBottom, MARK_RED);
        drawText(airCtx,"d", dLineX + 12, (dTop + dBottom)/2, {font:"bold italic 18px", color:MARK_RED,align:"left",bold:true});
    }

    const rayTopY = H * 0.06;
    const raySpacing = 42;
    const rayStartX = cx - raySpacing * 2;
    for(let i=0;i<4;i++){
        const rx = rayStartX + i * raySpacing;
        drawArrow(airCtx, rx, rayTopY, rx, lensTopY - 10, lightCol);
    }
    drawArrow(airCtx, Mx, rayTopY, Mx, My, lightCol);

    const mToTopX = Mx - outBias;
    const ray1OutX = mToTopX - outBias * 2;
    const ray1OutY = lensTopY - rayOutOffset;
    drawArrow(airCtx, Mx, My, mToTopX, lensTopY, lightCol);
    drawArrow(airCtx, mToTopX, lensTopY, ray1OutX, ray1OutY, lightCol);

    const pToTopX = Px - gap;
    const ray2OutX = pToTopX - outBias * 2;
    const ray2OutY = lensTopY - (rayOutOffset + 5);
    drawArrow(airCtx, Mx, My, OPrimeX, OPrimeY, lightCol);
    drawArrow(airCtx, OPrimeX, OPrimeY, Px, Py, lightCol);
    drawArrow(airCtx, Px, Py, pToTopX, lensTopY, lightCol);
    drawArrow(airCtx, pToTopX, lensTopY, ray2OutX, ray2OutY, lightCol);

    function drawCircleMark(ctx, x, y, num, color){
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 14, 0, Math.PI*2);
        ctx.stroke();
        drawText(ctx, num, x, y, {font:"bold 16px", color:color,bold:true});
    }
    drawCircleMark(airCtx, ray1OutX + 10, ray1OutY + 10, "①", lightCol);
    drawCircleMark(airCtx, ray2OutX + 10, ray2OutY + 10, "②", lightCol);

    airCtx.fillStyle="#d0e0f8";
    drawText(airCtx,"平凸透镜",leftX-14,lensTopY+16,{font:"13px",align:"right",bold:true});
    drawText(airCtx,"空气薄膜",cx-65,(plateY+lensTopY)/2,{font:"13px",align:"right",bold:true});
    airCtx.fillStyle="#b0e8c8";
    drawText(airCtx,"平面玻璃板",cx+halfW+14,plateBot-8,{font:"13px",align:"left",bold:true});
}

function toggleAutoRun(){
    const btn = document.getElementById("autoRunBtn");
    if(autoRunning){
        stopAutoAnim();
        btn.classList.remove("pause");
        btn.innerText = "▶ 开始自动变化";
    }else{
        startAutoAnim();
        btn.classList.add("pause");
        btn.innerText = "⏸ 暂停自动变化";
    }
}

function stopAutoAnim(){
    autoRunning = false;
    if(autoTimer) clearInterval(autoTimer);
    autoTimer = null;
}

function startAutoAnim(){
    stopAutoAnim();
    autoRunning = true;
    const speedIdx = Number(document.getElementById("speedSlider").value);
    const step = speedStep[speedIdx];
    autoTimer = setInterval(()=>{
        const autoLam = document.getElementById("autoLamCheck").checked;
        const autoR = document.getElementById("autoRCheck").checked;
        
        if(autoLam && state.lightMode === "mono"){
            state.lambda += lamDir * step;
            if(state.lambda >=780) lamDir = -1;
            if(state.lambda <=380) lamDir = 1;
            document.getElementById("sliderLam").value = state.lambda;
            document.getElementById("numLam").value = state.lambda;
        }
        if(autoR){
            state.R += RDir * step * 0.01;
            if(state.R >=20) RDir = -1;
            if(state.R <=0.5) RDir = 1;
            document.getElementById("sliderR").value = state.R;
            document.getElementById("numR").value = state.R.toFixed(2);
        }
        refreshAll();
    }, 30);
}

                <td>几何近似关系</td>

                <td>δ = (2k+1)λ/2 &nbsp;&nbsp; k=0,1,2,3…</td>

                <td>k级暗环半径公式</td>

            </tr>
            <tr>
                <td>透镜曲率半径测量公式</td>

            </tr>
            <tr>
                <td>入射波长λ影响规律</td>

            </tr>
            <tr>
                <td>测量误差消除规律</td>
                <td>透镜接触点存在挤压形变，直接测量中心暗环存在系统误差；取相隔m级的两组暗环直径计算R，可消除接触形变带来的误差。</td>
            </tr>
        </table>
        `;

}
